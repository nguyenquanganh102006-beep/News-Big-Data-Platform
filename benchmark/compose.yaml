name: news-benchmark
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: ["benchmark-redis:/data"]
    mem_limit: 1500m
    cpus: 2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:19092:19092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    mem_limit: 1500m
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 15
  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_DB: benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark_local_only
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["benchmark-postgres:/var/lib/postgresql/data"]
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark"]
      interval: 5s
      timeout: 5s
      retries: 15
  worker:
    build: .
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      SPARK_LOCAL_IP: 127.0.0.1
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    volumes: ["./:/bench", "benchmark-storage:/storage", "../src:/project/src:ro"]
    working_dir: /bench
    command: ["sleep", "infinity"]
    mem_limit: 5g
    cpus: 2
    depends_on:
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
volumes:
  benchmark-redis:
  benchmark-storage:
  benchmark-postgres:
