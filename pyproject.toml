[project]
name = "news-big-data-platform"
version = "0.1.0"
description = "News Big Data platform"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "beautifulsoup4",
    "feedparser",
    "pandas",
    "pyarrow",
    "polars",
    "python-dotenv",
    "pydantic",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"